# ==========================================
# COMPONENTES Y ESQUEMAS REUTILIZABLES
# ==========================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT firmado obtenido a través del endpoint `/api/auth/login`.
        Debe enviarse en la cabecera HTTP: `Authorization: Bearer <TOKEN>`

  # ----------------------------------------
  # PARÁMETROS REUTILIZABLES
  # ----------------------------------------
  parameters:
    ParamCodigoPath:
      name: codigo
      in: path
      required: true
      description: Código único hash hexadecimal de 32 caracteres que identifica al registro.
      schema:
        type: string
        minLength: 32
        maxLength: 32
        pattern: '^[a-f0-9]{32}$'
        example: "5691531ac558866c93472e22d0e983c4"

    ParamLocalidad:
      name: localidad
      in: query
      required: false
      description: Código hash de 32 caracteres de la localidad (Alias legible de `p_codigo_localidad`).
      schema:
        type: string
        minLength: 32
        maxLength: 32
        pattern: '^[a-f0-9]{32}$'
        example: "07d306e4eb6931d332b76fd169a70beb"

    ParamCategoria:
      name: categoria
      in: query
      required: false
      description: Código hash de 32 caracteres de la categoría (Alias legible de `p_codigo_categoria`).
      schema:
        type: string
        minLength: 32
        maxLength: 32
        pattern: '^[a-f0-9]{32}$'
        example: "e5d26a1b0c9f8a7e6d5c4b3a2f1e0d9c"

    ParamCategoriaNombre:
      name: categoria
      in: query
      required: false
      description: Nombre o texto de la categoría de destino (Alias de `p_categoria`, máx. 100 caracteres).
      schema:
        type: string
        maxLength: 100
        example: "Sitio Arqueológico"

    ParamSubcategoria:
      name: subcategoria
      in: query
      required: false
      description: Código hash de 32 caracteres de la subcategoría (Alias legible de `p_codigo_subcategoria`).
      schema:
        type: string
        minLength: 32
        maxLength: 32
        pattern: '^[a-f0-9]{32}$'
        example: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d"

    ParamCircuito:
      name: circuito
      in: query
      required: false
      description: Código hash de 32 caracteres del circuito turístico (Alias de `p_codigo_circuito`).
      schema:
        type: string
        minLength: 32
        maxLength: 32
        pattern: '^[a-f0-9]{32}$'
        example: "6c2d9a6c7613589b4f9119f97d544ff2"

    ParamTipo:
      name: tipo
      in: query
      required: false
      description: Código hash de 32 caracteres del tipo de prestador (Alias de `p_codigo_tipo`).
      schema:
        type: string
        minLength: 32
        maxLength: 32
        pattern: '^[a-f0-9]{32}$'
        example: "8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c"

    ParamIdioma:
      name: idioma
      in: query
      required: false
      description: Código hash de 32 caracteres del idioma (Alias de `p_codigo_idioma`).
      schema:
        type: string
        minLength: 32
        maxLength: 32
        pattern: '^[a-f0-9]{32}$'
        example: "3b2a1c0d9e8f7a6b5c4d3e2f1a0b9c8d"

    ParamSeccion:
      name: seccion
      in: query
      required: false
      description: Código hash de 32 caracteres de la sección institucional (Alias de `p_codigo_seccion`).
      schema:
        type: string
        minLength: 32
        maxLength: 32
        pattern: '^[a-f0-9]{32}$'
        example: "ef1234567890abcdef1234567890abcd"

    ParamSubseccion:
      name: subseccion
      in: query
      required: false
      description: Código hash de 32 caracteres de la subsección (Alias de `p_codigo_subseccion`).
      schema:
        type: string
        minLength: 32
        maxLength: 32
        pattern: '^[a-f0-9]{32}$'
        example: "f1234567890abcdef1234567890abcde"

    ParamDesde:
      name: desde
      in: query
      required: false
      description: Fecha de inicio de eventos en formato ISO `YYYY-MM-DD` (Alias de `p_desde`).
      schema:
        type: string
        format: date
        example: "2026-09-01"

    ParamHasta:
      name: hasta
      in: query
      required: false
      description: Fecha límite o de fin de eventos en formato ISO `YYYY-MM-DD` (Alias de `p_hasta`).
      schema:
        type: string
        format: date
        example: "2026-09-30"

    ParamTucmesa:
      name: tucmesa
      in: query
      required: false
      description: Filtro booleano para gastronomía adherida al programa TucMesa (1 = Adherido, 0 = No adherido).
      schema:
        type: integer
        enum: [0, 1]
        example: 1

    ParamDestacado:
      name: destacado
      in: query
      required: false
      description: Filtro para artículos destacados en portada (1 = Destacado, 0 = Estándar).
      schema:
        type: integer
        enum: [0, 1]
        example: 1

    ParamBusqueda:
      name: busqueda
      in: query
      required: false
      description: Búsqueda libre por coincidencia de texto (Alias de `p_busqueda`, máximo 150 caracteres).
      schema:
        type: string
        maxLength: 150
        example: "Tafi"

    ParamLimite:
      name: limite
      in: query
      required: false
      description: Cantidad máxima de registros a retornar por página (Alias de `p_limit`, predeterminado 50).
      schema:
        type: integer
        minimum: 1
        default: 50
        example: 10

    ParamOffset:
      name: offset
      in: query
      required: false
      description: Salto o desplazamiento inicial de registros para paginación (Alias de `p_offset`, predeterminado 0).
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0

  # ----------------------------------------
  # RESPUESTAS COMUNES
  # ----------------------------------------
  responses:
    BadRequestError:
      description: Error de validación o conflicto entre aliases y parámetros canónicos
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorValidationResponse'
              - $ref: '#/components/schemas/ErrorConflictResponse'

    NotFoundError:
      description: Endpoint o recurso no encontrado en el sistema
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorNotFoundResponse'

    InternalServerError:
      description: Error no controlado en la ejecución o fallo interno de infraestructura
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInternalServerResponse'

  # ----------------------------------------
  # MODELOS Y ESQUEMAS DE DATOS
  # ----------------------------------------
  schemas:
    # --- Health & Auth ---
    HealthResponse:
      type: object
      required:
        - status
        - runtime
        - timestamp
      properties:
        status:
          type: string
          example: "online"
        runtime:
          type: string
          example: "PHP 7.4.33"
        timestamp:
          type: integer
          description: Marca temporal Unix en milisegundos
          example: 1790724493649

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "admin@local.com"
        password:
          type: string
          format: password
          example: "123456"

    LoginSuccessResponse:
      type: object
      required:
        - success
        - message
        - token
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Autenticación exitosa"
        token:
          type: string
          description: Token JWT con firma criptográfica HMAC-SHA256
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c2VyXzEyMyIsImVtYWlsIjoiYWRtaW5AbG9jYWwuY29tIiwicm9sZSI6ImFkbWluIiwiZXhwIjoxNzkwNzI4MDkzfQ..."

    UserProfileResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Acceso autorizado al perfil"
        data:
          type: object
          required:
            - sub
            - email
            - role
            - exp
          properties:
            sub:
              type: string
              example: "user_123"
            email:
              type: string
              example: "admin@local.com"
            role:
              type: string
              example: "admin"
            exp:
              type: integer
              description: Marca de expiración Unix del token
              example: 1790728093

    # --- Catálogos ---
    Localidad:
      type: object
      properties:
        codigo:
          type: string
          pattern: '^[a-f0-9]{32}$'
          example: "07d306e4eb6931d332b76fd169a70beb"
        nombre:
          type: string
          example: "San Miguel de Tucumán"
        codigo_postal:
          type: string
          example: "4000"

    Circuito:
      type: object
      properties:
        codigo:
          type: string
          pattern: '^[a-f0-9]{32}$'
          example: "6c2d9a6c7613589b4f9119f97d544ff2"
        nombre:
          type: string
          example: "Circuito Las Yungas"
        descripcion:
          type: string
          example: "Recorrido turístico por la selva subtropical de montaña"

    CategoriaHotel:
      type: object
      properties:
        codigo:
          type: string
          pattern: '^[a-f0-9]{32}$'
          example: "b3f07a2a0e41712a4a7541249e0c5d64"
        nombre:
          type: string
          example: "4 Estrellas"

    CategoriaEvento:
      type: object
      properties:
        codigo:
          type: string
          pattern: '^[a-f0-9]{32}$'
          example: "e5d26a1b0c9f8a7e6d5c4b3a2f1e0d9c"
        nombre:
          type: string
