    # --- Modelos de Error Estandarizados ---
    ErrorAuthBadRequest:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Credenciales incompletas"

    ErrorAuthUnauthorized:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Credenciales inválidas"

    ErrorValidationResponse:
      type: object
      required:
        - error
        - details
      properties:
        error:
          type: string
          example: "Parámetros de consulta inválidos"
        details:
          type: object
          description: Diccionario asociativo donde la clave es el parámetro y el valor es la lista de mensajes de validación fallidos
          additionalProperties:
            type: array
            items:
              type: string
          example:
            p_codigo_localidad:
              - "El campo p_codigo_localidad debe tener exactamente 32 caracteres."
            p_limit:
              - "El campo p_limit debe contener solo dígitos numéricos."

    ErrorConflictResponse:
      type: object
      required:
        - error
        - details
      properties:
        error:
          type: string
          example: "Parámetros de consulta en conflicto"
        details:
          type: object
          required:
            - alias
            - parameter
          properties:
            alias:
              type: string
              example: "localidad"
            parameter:
              type: string
              example: "p_codigo_localidad"

    ErrorUnauthorizedResponse:
      type: object
      required:
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Token no proporcionado o formato inválido"

    ErrorForbiddenResponse:
      type: object
      required:
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Token inválido o expirado"

    ErrorNotFoundResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Endpoint no encontrado"

    ErrorInternalServerResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Error interno del servidor"
