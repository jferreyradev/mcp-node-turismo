openapi: 3.0.3
info:
  title: API Turismo (Clean Architecture)
  version: 1.0.0
  description: |
    API REST de Turismo desarrollada en **PHP Puro compatible con PHP 7.4 y PHP 8.x** bajo **Clean Architecture**.
    Permite consultar catálogos oficiales, eventos culturales, alojamientos hoteleros, prestadores, gastronomía, destinos, circuitos y contenido institucional.
    
    ### Características Clave:
    - **Soporte de Aliases Legibles y Parámetros Canónicos**: Todos los parámetros de consulta admiten tanto su alias amigable (ej: `localidad`, `limite`) como su parámetro canónico (`p_codigo_localidad`, `p_limit`).
    - **Normalización de Agregados**: Los campos `telefonos` y `servicios` son serializados automáticamente como listas (`array`) nativas en JSON.
    - **Rutas Duales**: Se admiten tanto rutas bajo el prefijo tradicional `/api/v1/...` como rutas directas en subdominios dedicados `/v1/...`.
    - **Respuestas JSON Consistentes**: Envoltura homogénea con `{"success": true, "data": [...]}` en operaciones exitosas y estructuras de error tipadas en códigos 4xx/5xx.
servers:
  - url: http://api.tucumanturismo.gob.ar
    description: Servidor de Producción Oficial
  - url: http://127.0.0.1:8080
    description: Servidor Local de Desarrollo (Puerto 8080)
  - url: http://localhost:8000
    description: Servidor Local de Desarrollo (Puerto 8000)

tags:
  - name: Health
    description: Disponibilidad, chequeo de salud y monitoreo de infraestructura
  - name: Autenticación
    description: Inicio de sesión y generación de tokens JWT
  - name: Usuarios
    description: Información y perfil del usuario autenticado
  - name: Catálogos
    description: Tablas maestras y catálogos base del sistema
  - name: Eventos
    description: Agenda, eventos y festivales turísticos
  - name: Hoteles
    description: Alojamientos y establecimientos hoteleros
  - name: Prestadores
    description: Prestadores habilitados de servicios turísticos
  - name: Destinos
    description: Atractivos y destinos provinciales
  - name: Gastronomía
    description: Locales gastronómicos y comercios adheridos al programa TucMesa
  - name: Agencias
    description: Agencias oficiales de viajes y turismo
  - name: Guías
    description: Guías profesionales de turismo
  - name: Contenido Institucional
    description: Secciones, subsecciones y artículos informativos
  - name: Lugares
    description: Puntos de interés y sitios turísticos de la provincia

paths:
  # ==========================================
  # 1. HEALTHCHECK
  # ==========================================
  /health:
    get:
      tags:
        - Health
      summary: Comprobación de disponibilidad (Healthcheck)
      description: Permite a balanceadores de carga, proxies y herramientas de monitoreo verificar el estado del servicio y la versión de PHP en ejecución.
      responses:
        '200':
          description: Servicio online y operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/health:
    get:
      tags:
        - Health
      summary: Comprobación de disponibilidad (con prefijo /api)
      description: Variante con prefijo `/api` del chequeo de disponibilidad.
      responses:
        '200':
          description: Servicio online y operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ==========================================
  # 2. AUTENTICACIÓN Y PERFIL
  # ==========================================
  /api/auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión de usuario (Login)
      description: Autentica credenciales y emite un token JWT firmado con HMAC-SHA256 con vigencia de 1 hora.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          description: Credenciales incompletas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthBadRequest'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnauthorized'

  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión de usuario (Ruta directa)
      description: Endpoint de login accesible directamente sin prefijo `/api`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          description: Credenciales incompletas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthBadRequest'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnauthorized'

  /api/users/profile:
    get:
      tags:
        - Usuarios
      summary: Consultar perfil del usuario autenticado
      description: Obtiene la información del usuario contenida en el token JWT. Requiere cabecera Bearer Token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Acceso autorizado al perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Token no proporcionado o formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorizedResponse'
        '403':
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbiddenResponse'

  /users/profile:
    get:
      tags:
        - Usuarios
      summary: Consultar perfil del usuario (Ruta directa)
      description: Variante directa de consulta de perfil sin prefijo `/api`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Acceso autorizado al perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Token no proporcionado o formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorizedResponse'
        '403':
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbiddenResponse'

  # ==========================================
  # 3. CATÁLOGOS BASE
  # ==========================================
  /api/v1/localidades:
    get:
      tags:
        - Catálogos
      summary: Listar todas las localidades
      description: Devuelve el catálogo oficial de localidades de la provincia con código hash de 32 caracteres, nombre y código postal.
      responses:
        '200':
          description: Listado de localidades obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Localidad'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/circuitos:
    get:
      tags:
        - Catálogos
      summary: Listar circuitos turísticos
      description: Devuelve los circuitos turísticos oficiales provinciales. Este recurso cuenta con TTL 0 (siempre fresco, sin almacenamiento en caché).
      responses:
        '200':
          description: Listado de circuitos obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Circuito'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/hoteles-categorias:
    get:
      tags:
        - Hoteles
      summary: Listar categorías de hoteles y alojamientos
      description: Devuelve las categorías habilitadas de hospedaje (estrellas, aparts, hostales, cabañas).
      responses:
        '200':
          description: Listado de categorías de hoteles obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoriaHotel'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/eventos-categorias:
    get:
      tags:
        - Eventos
      summary: Listar categorías temáticas de eventos
      description: Devuelve las categorías temáticas de agenda y festivales (culturales, deportivos, gastronómicos).
      responses:
        '200':
          description: Listado de categorías de eventos obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoriaEvento'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/eventos-subcategorias:
    get:
      tags:
        - Eventos
      summary: Listar subcategorías de eventos
      description: Devuelve las subcategorías temáticas. Permite filtrar opcionalmente por una categoría padre específica.
      parameters:
        - $ref: '#/components/parameters/ParamCategoria'
      responses:
        '200':
          description: Listado de subcategorías de eventos obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubcategoriaEvento'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/prestadores-tipos:
    get:
      tags:
        - Prestadores
      summary: Listar tipos de prestadores turísticos
      description: Devuelve los tipos habilitados de prestadores de actividades turísticas (turismo aventura, agencias receptivas, etc.).
      responses:
        '200':
          description: Listado de tipos de prestadores obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TipoPrestador'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/gastronomia-categorias:
    get:
      tags:
        - Gastronomía
      summary: Listar categorías gastronómicas
      description: Devuelve las tipologías de establecimientos gastronómicos (restaurantes, bares, peñas folclóricas, confiterías).
      responses:
        '200':
          description: Listado de categorías gastronómicas obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoriaGastronomia'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/idiomas:
    get:
      tags:
        - Contenido Institucional
      summary: Listar idiomas disponibles
      description: Devuelve los idiomas en los que se encuentra redactado el contenido institucional y artículos.
      responses:
        '200':
          description: Listado de idiomas obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Idioma'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # 4. EVENTOS
  # ==========================================
  /api/v1/eventos:
    get:
      tags:
        - Eventos
      summary: Listar eventos turísticos y culturales
      description: |
        Consulta el listado dinámico de eventos provinciales con soporte de filtros por rango de fechas, localidad, categorías y búsqueda textual libre.
        El campo `telefonos` es normalizado como array nativo de cadenas.
      parameters:
        - $ref: '#/components/parameters/ParamDesde'
        - $ref: '#/components/parameters/ParamHasta'
        - $ref: '#/components/parameters/ParamLocalidad'
        - $ref: '#/components/parameters/ParamCategoria'
        - $ref: '#/components/parameters/ParamSubcategoria'
        - $ref: '#/components/parameters/ParamBusqueda'
        - $ref: '#/components/parameters/ParamLimite'
        - $ref: '#/components/parameters/ParamOffset'
      responses:
        '200':
          description: Colección de eventos filtrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Evento'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/evento-detalle/{codigo}:
    get:
      tags:
        - Eventos
      summary: Obtener detalle completo de un evento
      description: Devuelve la ficha completa de un evento mediante su identificador hash de 32 caracteres.
      parameters:
        - $ref: '#/components/parameters/ParamCodigoPath'
      responses:
        '200':
          description: Ficha de detalle del evento
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Evento'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/eventos/{codigo}:
    get:
      tags:
        - Eventos
      summary: Obtener detalle de evento (Ruta REST canónica)
      description: Ruta equivalente y compatible para consultar la ficha individual de un evento.
      parameters:
        - $ref: '#/components/parameters/ParamCodigoPath'
      responses:
        '200':
          description: Ficha de detalle del evento
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Evento'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # 5. HOTELES / ALOJAMIENTOS
  # ==========================================
  /api/v1/hoteles:
    get:
      tags:
        - Hoteles
      summary: Listar hoteles y alojamientos
      description: |
        Consulta hoteles y alojamientos filtrados por localidad, categoría y búsqueda por nombre.
        Los campos `telefonos` y `servicios` son automáticamente transformados a listas JSON nativas.
      parameters:
        - $ref: '#/components/parameters/ParamLocalidad'
        - $ref: '#/components/parameters/ParamCategoria'
        - $ref: '#/components/parameters/ParamBusqueda'
        - $ref: '#/components/parameters/ParamLimite'
        - $ref: '#/components/parameters/ParamOffset'
      responses:
        '200':
          description: Colección de alojamientos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Hotel'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/hotel-detalle/{codigo}:
    get:
      tags:
        - Hoteles
      summary: Obtener detalle completo de un hotel
      description: Devuelve la ficha exhaustiva de un hotel o alojamiento por su código de 32 caracteres.
      parameters:
        - $ref: '#/components/parameters/ParamCodigoPath'
      responses:
        '200':
          description: Ficha individual del hotel
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Hotel'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # 6. PRESTADORES DE SERVICIOS
  # ==========================================
  /api/v1/prestadores:
    get:
      tags:
        - Prestadores
      summary: Listar prestadores turísticos
      description: Consulta prestadores habilitados de actividades y servicios turísticos.
      parameters:
        - $ref: '#/components/parameters/ParamLocalidad'
        - $ref: '#/components/parameters/ParamTipo'
        - $ref: '#/components/parameters/ParamBusqueda'
        - $ref: '#/components/parameters/ParamLimite'
        - $ref: '#/components/parameters/ParamOffset'
      responses:
        '200':
          description: Colección de prestadores turísticos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Prestador'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/prestador-detalle/{codigo}:
    get:
      tags:
        - Prestadores
      summary: Obtener detalle de un prestador
      description: Devuelve la ficha individual de un prestador de servicios turísticos.
      parameters:
        - $ref: '#/components/parameters/ParamCodigoPath'
      responses:
        '200':
          description: Ficha individual del prestador
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Prestador'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # 7. DESTINOS TURÍSTICOS
  # ==========================================
  /api/v1/destinos:
    get:
      tags:
        - Destinos
      summary: Listar atractivos y destinos turísticos
      description: Consulta atractivos turísticos filtrables por localidad, circuito o categoría.
      parameters:
        - $ref: '#/components/parameters/ParamLocalidad'
        - $ref: '#/components/parameters/ParamCircuito'
        - $ref: '#/components/parameters/ParamCategoriaNombre'
        - $ref: '#/components/parameters/ParamBusqueda'
        - $ref: '#/components/parameters/ParamLimite'
        - $ref: '#/components/parameters/ParamOffset'
      responses:
        '200':
          description: Colección de atractivos y destinos turísticos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Destino'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/destino-detalle/{codigo}:
    get:
      tags:
        - Destinos
      summary: Obtener detalle de un destino
      description: Devuelve la ficha completa de un atractivo o destino turístico.
      parameters:
        - $ref: '#/components/parameters/ParamCodigoPath'
      responses:
        '200':
          description: Ficha individual del destino
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Destino'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # 8. GASTRONOMÍA
  # ==========================================
  /api/v1/gastronomia:
    get:
      tags:
        - Gastronomía
      summary: Listar establecimientos gastronómicos
      description: Consulta restaurantes, bares y peñas folclóricas. Permite filtrar por localidad, categoría y el sello distintivo `tucmesa`.
      parameters:
        - $ref: '#/components/parameters/ParamLocalidad'
        - $ref: '#/components/parameters/ParamCategoria'
        - $ref: '#/components/parameters/ParamTucmesa'
        - $ref: '#/components/parameters/ParamBusqueda'
        - $ref: '#/components/parameters/ParamLimite'
        - $ref: '#/components/parameters/ParamOffset'
      responses:
        '200':
          description: Colección de locales gastronómicos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Gastronomia'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/gastronomia-detalle/{codigo}:
    get:
      tags:
        - Gastronomía
      summary: Obtener detalle de un local gastronómico
      description: Devuelve la información completa de un local gastronómico.
      parameters:
        - $ref: '#/components/parameters/ParamCodigoPath'
      responses:
        '200':
          description: Ficha individual de gastronomía
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Gastronomia'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # 9. AGENCIAS DE VIAJES
  # ==========================================
  /api/v1/agencias:
    get:
      tags:
        - Agencias
      summary: Listar agencias de viajes
      description: Consulta las agencias oficiales y autorizadas de viajes y turismo.
      parameters:
        - $ref: '#/components/parameters/ParamLocalidad'
        - $ref: '#/components/parameters/ParamBusqueda'
        - $ref: '#/components/parameters/ParamLimite'
        - $ref: '#/components/parameters/ParamOffset'
      responses:
        '200':
          description: Colección de agencias de turismo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agencia'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/agencia-detalle/{codigo}:
    get:
      tags:
        - Agencias
      summary: Obtener detalle de una agencia
      description: Devuelve la ficha completa de una agencia de viajes.
      parameters:
        - $ref: '#/components/parameters/ParamCodigoPath'
      responses:
        '200':
          description: Ficha individual de la agencia
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agencia'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # 10. GUÍAS DE TURISMO
  # ==========================================
  /api/v1/guias:
    get:
